name: bootstrap
on:
  workflow_dispatch:
    inputs:
      release_tag_name:
        description: release tag name
        required: false
        default: ""
        type: choice
        options:
          - ""
          - bootstrap-unstable
          - 0.1.0
permissions:
  contents: write
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        runner:
          # - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/kudzu
          path: result-kudzu
      - uses: ./result-kudzu/.github/actions/install-nix
      - uses: cachix/cachix-action@master
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: rm -f ~/.config/nix/nix.conf
      - run: |
          sed -i '/users\.users\.nix-on-droid\.shell = lib.getExe pkgs\.bash;/a users.users.nix-on-droid.uid = lib.mkForce 10377;' template/nix-on-droid.nix
          sed -i '/users\.users\.nix-on-droid\.shell = lib.getExe pkgs\.bash;/a users.groups.nix-on-droid.gid = lib.mkForce 10377;' template/nix-on-droid.nix
          nix build --verbose --print-build-logs --impure --print-out-paths ./template#nixosConfigurations.default.config.system.build.toplevel --override-input nix-on-droid path:.
          nix build --verbose --print-build-logs --impure --print-out-paths .#bootstrap-zip
      - if: ${{ runner.arch == 'ARM64' }}
        run: bash tests/test-bootstrap.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ runner.arch == 'X64' }}
        run: nix build github:t184256/droidctl --out-link /tmp/droidctl
      - if: ${{ runner.arch == 'X64' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: >
            set -e && trap 'pkill --exact --signal SIGKILL crashpad_handle || true' EXIT && adb push result/bootstrap-x86_64.zip /data/local/tmp/ && /tmp/droidctl/bin/droidctl run tests/bootstrap_test.py

      - if: ${{ runner.arch == 'X64' && always() }}
        uses: actions/upload-artifact@main
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - if: ${{ inputs.release_tag_name != '' }}
        run: |
          git tag -f ${{ inputs.release_tag_name }}
          git push origin ${{ inputs.release_tag_name }} --force
      - uses: softprops/action-gh-release@master
        if: ${{ inputs.release_tag_name != '' }}
        with:
          tag_name: ${{ inputs.release_tag_name }}
          files: result/bootstrap-*.zip
