name: test
on:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@main
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/kudzu
          path: result-kudzu
      - uses: ./result-kudzu/.github/actions/install-nix
      - uses: cachix/cachix-action@master
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: rm -f ~/.config/nix/nix.conf
      - run: |
          sed -i '/users\.users\.nix-on-droid\.shell = lib.getExe pkgs\.bash;/a users.users.nix-on-droid.uid = lib.mkForce 10377;' template/nix-on-droid.nix
          sed -i '/users\.users\.nix-on-droid\.shell = lib.getExe pkgs\.bash;/a users.groups.nix-on-droid.gid = lib.mkForce 10377;' template/nix-on-droid.nix
          nix build --verbose --print-build-logs --impure --print-out-paths ./template#nixosConfigurations.default.config.system.build.toplevel --override-input nix-on-droid path:.
          nix build --verbose --print-build-logs --impure --print-out-paths .#bootstrap-zip
      - run: bash tests/test-bootstrap.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ runner.arch == 'X64' }}
        run: nix build github:t184256/droidctl --out-link /tmp/droidctl
      - if: ${{ runner.arch == 'X64' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-spellchecker: true
          script: >
            set -e && trap 'pkill --exact --signal SIGKILL crashpad_handle || true' EXIT && adb push result/bootstrap-x86_64.zip /data/local/tmp/ && /tmp/droidctl/bin/droidctl run tests/bootstrap_test.py

      - if: ${{ runner.arch == 'X64' && always() }}
        uses: actions/upload-artifact@main
        with:
          name: screenshots
          path: screenshots
